[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.3.3"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mlm-games/game-utils"
rust-version = "1.98"

[workspace.dependencies]
glam = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.12"
directories = "6"
unic-langid = "0.9"
fluent-bundle = "0.16"
rand = "0.10"
web-time = "1.1"
game-utils = { path = "crates/game-utils", version = "0.3.3" }
game-utils-ai = { path = "crates/game-utils-ai", version = "0.3.3" }
game-utils-combat = { path = "crates/game-utils-combat", version = "0.3.3" }
game-utils-grid = { path = "crates/game-utils-grid", version = "0.3.3" }
game-utils-inventory = { path = "crates/game-utils-inventory", version = "0.3.3" }
game-utils-progression = { path = "crates/game-utils-progression", version = "0.3.3" }
game-utils-quest = { path = "crates/game-utils-quest", version = "0.3.3" }
game-utils-vehicle = { path = "crates/game-utils-vehicle", version = "0.3.3" }
game-utils-repame = { path = "crates/game-utils-repame", version = "0.3.3" }
repame-sim = "0.1"
repame-fx = "0.1"
bubbles-dialogue = "2"
pathfinding = "4"
