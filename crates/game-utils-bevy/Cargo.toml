[package]
name = "game-utils-bevy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bevy game-feel utilities (juice, screen effects, transitions, vfx, pooled audio, entity pooling) extracted from existing games"
repository = { workspace = true }
keywords = ["bevy", "gamedev", "game-feel", "juice", "vfx"]
categories = ["game-development"]
publish = false

[dependencies]
game-utils.workspace = true
bevy.workspace = true
rand.workspace = true
serde.workspace = true
web-time.workspace = true

[features]
default = ["audio", "transitions", "screen_effects", "pooling", "time_scale"]
audio = []
transitions = []
screen_effects = []
pooling = []
time_scale = []
# Opt-in wgpu backend (`bevy_render` + `bevy_core_pipeline`).
# Everything else (ECS, sprites/UI/text types, audio, input, camera,
# transform, state, time) builds wgpu-free and coexists with other
# wgpu versions (e.g. repose). Only `post_process` needs this.
render = ["bevy/bevy_render", "bevy/bevy_core_pipeline"]
full = ["audio", "transitions", "screen_effects", "pooling", "time_scale", "render"]

[lints.clippy]
type_complexity = "allow"
