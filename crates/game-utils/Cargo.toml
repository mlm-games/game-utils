[package]
name = "game-utils"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bevy-agnostic game utility library (math, save, crash-safe save store, weighted random, stats, unlocks, achievements, i18n) extracted from existing games"
repository = { workspace = true }
keywords = ["game", "gamedev", "utility", "save", "i18n", "random"]
categories = ["game-development"]

[features]
default = []
grid = ["dep:game-utils-grid"]
inventory = ["dep:game-utils-inventory"]
combat = ["dep:game-utils-combat"]
progression = ["dep:game-utils-progression"]
quest = ["dep:game-utils-quest"]
ai = ["dep:game-utils-ai"]

[dependencies]
glam.workspace = true
serde.workspace = true
web-time.workspace = true
serde_json.workspace = true
ron.workspace = true
directories.workspace = true
rand.workspace = true
unic-langid.workspace = true
fluent-bundle.workspace = true
game-utils-grid = { workspace = true, optional = true }
game-utils-inventory = { workspace = true, optional = true }
game-utils-combat = { workspace = true, optional = true }
game-utils-progression = { workspace = true, optional = true }
game-utils-quest = { workspace = true, optional = true }
game-utils-ai = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
opfs = { git = "https://github.com/mlm-games/opfs" }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
