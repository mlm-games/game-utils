[package]
name = "game-utils"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bevy-agnostic game utility library (math, save, crash-safe save store, weighted random, stats, unlocks, achievements, i18n) extracted from existing games"
repository = { workspace = true }
keywords = ["game", "gamedev", "utility", "save", "i18n", "random"]
categories = ["game-development"]

[dependencies]
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
ron.workspace = true
directories.workspace = true
rand.workspace = true
unic-langid.workspace = true
fluent-bundle.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
opfs = { git = "https://github.com/mlm-games/opfs" }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
