[package]
name = "game-utils-vehicle"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Abstract vehicle dynamics primitives - input, engine, steering, integration"
repository.workspace = true
keywords = ["vehicle", "physics", "simulation"]
categories = ["game-development", "simulation"]

[features]
default = []
# rapier3d scene queries as a GroundProbe source (suspension raycasts).
rapier = ["dep:rapier3d"]

[dependencies]
glam = { version = "0.33", features = ["serde"] }
serde.workspace = true
bevy_ecs = "0.19"
repame-sim.workspace = true
rapier3d = { version = "0.34", optional = true, default-features = false, features = ["dim3", "f32", "std", "enhanced-determinism"] }
